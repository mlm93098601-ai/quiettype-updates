[package]
name = "ai-quick-input"
version = "0.2.8"
description = "QuietType - local macOS voice input"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
libloading = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"], default-features = false }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
cpal = "0.15"

# Keep the friend-distribution app small without changing runtime behavior.
[profile.release]
opt-level = "s"
strip = "symbols"
lto = "thin"
codegen-units = 1
